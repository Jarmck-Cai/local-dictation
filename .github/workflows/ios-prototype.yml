name: iOS prototype
on:
  push:
    branches: [codex/ios-prototype]
    paths: ['ios/**', 'services/ios-enhancement/**', '.github/workflows/ios-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test text gateway without paid calls
        working-directory: services/ios-enhancement
        run: npm test
  policies:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test offline and delivery policies
        run: swift test --package-path ios/LocalDictationCore
  native-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate native project
        run: bash ios/scripts/prepare.sh
      - name: Build app and extensions for simulator
        run: >-
          xcodebuild -project ios/LocalDictation.xcodeproj -scheme LocalDictation
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData/simulator
          CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app and extensions
        run: >-
          xcodebuild -project ios/LocalDictation.xcodeproj -scheme LocalDictation
          -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData/device
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Personal Team offline variant
        run: >-
          xcodebuild -project ios/LocalDictation.xcodeproj -scheme LocalDictationOffline
          -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData/offline
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify embedded service configuration
        run: |
          test -f ios/DerivedData/device/Build/Products/Debug-iphoneos/LocalDictation.app/Service.plist
          test -f ios/DerivedData/offline/Build/Products/Debug-iphoneos/LocalDictationOffline.app/Service.plist
      - name: Build and launch offline prototype in simulator
        run: |
          xcodebuild -project ios/LocalDictation.xcodeproj -scheme LocalDictationOffline \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData/offline-simulator \
            CODE_SIGNING_ALLOWED=NO build
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for ds in d["devices"].values() for x in ds if x["name"] == "iPhone 16"))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" ios/DerivedData/offline-simulator/Build/Products/Debug-iphonesimulator/LocalDictationOffline.app
          xcrun simctl launch "$DEVICE_ID" com.localdictation.prototype.offline
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot ios/prototype-launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-builds
          path: |
            ios/DerivedData/device/Build/Products/Debug-iphoneos/*.app
            ios/DerivedData/offline/Build/Products/Debug-iphoneos/*.app
            ios/prototype-launch.png
          retention-days: 7
