[package]
name = "local-dictation-gateway"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Lightweight pure-Rust dictation and vocabulary sync gateway for Qingshu (Local Dictation)"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
