# Coexisting Nginx loopback/HTTPS site template for Oracle VPS (Ubuntu 24.04)
# Keeps existing sites untouched; proxies `/healthz` and `/v1/*` to 127.0.0.1:8787
# without buffering audio uploads to disk (`proxy_request_buffering off`).

server {
    listen 127.0.0.1:18787;
    server_name dictation.astrmind.com localhost;

    client_max_body_size 20m;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /v1/dictate/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        # Allow a full gateway session even when the upstream sends no partials.
        proxy_read_timeout 610s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
