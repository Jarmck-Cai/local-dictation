name: LocalDictation
options:
  bundleIdPrefix: com.localdictation.prototype
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.4'
configFiles:
  Debug: Config/Developer.xcconfig
  Release: Config/Developer.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: group.com.localdictation.prototype.shared
    PRODUCT_BUNDLE_IDENTIFIER: com.localdictation.prototype
packages:
  LocalDictationCore:
    path: LocalDictationCore
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.1
targets:
  LocalDictationOffline:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Intents.swift]
      - Shared
    resources: [Config/Service.plist]
    info:
      path: Config/Offline-Info.plist
      properties:
        CFBundleDisplayName: 轻听写离线验证
        NSMicrophoneUsageDescription: 按下按钮时录制语音，在手机离线转为文字。
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        LDAppOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localdictation.prototype.offline
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_ONLY
    dependencies:
      - package: LocalDictationCore
      - package: SherpaOnnx
        product: sherpa-onnx
  LocalDictation:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    resources:
      - Config/Service.plist
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: 轻听写
        NSMicrophoneUsageDescription: 按下按钮时录制语音，在手机离线转为文字。
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LDAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: LocalDictationCore
      - package: SherpaOnnx
        product: sherpa-onnx
      - target: DictationKeyboard
      - target: DictationActivity
  DictationKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Config/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: 轻听写
        LDAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    entitlements:
      path: Config/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localdictation.prototype.keyboard
    dependencies:
      - package: LocalDictationCore
  DictationActivity:
    type: app-extension
    platform: iOS
    sources: [Activity, Shared/RecordingAttributes.swift, Shared/StopDictationIntent.swift, Shared/SharedEnvironment.swift]
    info:
      path: Config/Activity-Info.plist
      properties:
        CFBundleDisplayName: 轻听写录音
        LDAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Activity.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localdictation.prototype.activity
    dependencies:
      - package: LocalDictationCore
schemes:
  LocalDictationOffline:
    build:
      targets:
        LocalDictationOffline: all
    run:
      config: Debug
  LocalDictation:
    build:
      targets:
        LocalDictation: all
    run:
      config: Debug
